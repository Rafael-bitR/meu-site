<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reservas | Resort Beira-Mar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="menu"></div>

    <main class="pagina-interna pagina-reservas">
      <section class="container">
        <h1 class="titulo-interno">RESERVAS E CONTATO</h1>

        <div class="row g-5">
          <section class="col-12 col-lg-6">
            <h2>Informações de Contato</h2>
            <p>Telefone: <a href="tel:+551100000000">+55 (11) 0000-0000</a></p>
            <p>
              E-mail:
              <a href="mailto:resort_beira_mar@gmail.com">
                resort_beira_mar@gmail.com
              </a>
            </p>
            <p>Endereço: Enseada dos Corais, Cabo de Santo Agostinho - PE</p>

            <div class="ratio ratio-16x9 mapa-container">
              <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7895.829233353311!2d-34.95125365503407!3d-8.311283816896534!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x7aae8ca3a613507%3A0x95b7e55fe13789b4!2sEnseada%20dos%20Corais!5e0!3m2!1spt-BR!2sbr!4v1793249934920!5m2!1spt-BR!2sbr"
                title="Mapa da localização aproximada do Resort Beira-Mar em Enseada dos Corais"
                allowfullscreen
                loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"
              ></iframe>
            </div>
          </section>

          <section class="col-12 col-lg-6">
            <h2>Formulário de Reserva</h2>

            <form>
              <label for="nome">Nome</label>
              <input class="form-control" id="nome" name="nome" type="text" />

              <label for="email">E-mail</label>
              <input
                class="form-control"
                id="email"
                name="email"
                type="email"
              />

              <label for="telefone">Telefone</label>
              <input
                class="form-control"
                id="telefone"
                name="telefone"
                type="tel"
              />

              <label for="entrada">Data de entrada</label>
              <input
                class="form-control"
                id="entrada"
                name="entrada"
                type="date"
              />

              <label for="saida">Data de saída</label>
              <input class="form-control" id="saida" name="saida" type="date" />

              <label for="hospedes">Nº de hóspedes</label>
              <input
                class="form-control"
                id="hospedes"
                name="hospedes"
                type="number"
                min="1"
              />

              <label for="mensagem">Mensagem</label>
              <textarea
                class="form-control"
                id="mensagem"
                name="mensagem"
                rows="4"
              ></textarea>

              <button class="btn botao-enviar" type="button">ENVIAR</button>
            </form>
          </section>
        </div>
      </section>
    </main>

    <div id="footer"></div>
    <script src="js/menu.js"></script>
  </body>
</html>
