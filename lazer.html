<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Lazer | Resort Beira-Mar</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Poppins:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div id="menu"></div>

    <main class="pagina-lazer">
      <section class="container">
        <h1 class="titulo-pagina-lazer">LAZER</h1>

        <div class="row g-4">
          <div class="col-12 col-md-6">
            <article class="card h-100">
              <img
                src="img/lazer-externo/piscina-ampla.jpg"
                class="card-img-top"
                alt="Piscina do resort"
              />
              <div class="card-body">
                <h2 class="card-title">Piscina</h2>
              </div>
            </article>
          </div>

          <div class="col-12 col-md-6">
            <article class="card h-100">
              <img
                src="img/lazer-externo/academia.jpg"
                class="card-img-top"
                alt="Academia do resort"
              />
              <div class="card-body">
                <h2 class="card-title">Academia</h2>
              </div>
            </article>
          </div>

          <div class="col-12 col-md-6">
            <article class="card h-100">
              <img
                src="img/lazer-externo/spa.jpg"
                class="card-img-top"
                alt="Spa do resort"
              />
              <div class="card-body">
                <h2 class="card-title">Spa</h2>
              </div>
            </article>
          </div>

          <div class="col-12 col-md-6">
            <article class="card h-100">
              <img
                src="img/praias/destaque.jpg"
                class="card-img-top"
                alt="Praia próxima ao resort"
              />
              <div class="card-body">
                <h2 class="card-title">Praia</h2>
              </div>
            </article>
          </div>

          <div class="col-12 col-md-6">
            <article class="card h-100">
              <img
                src="img/lazer-externo/esporte.jpg"
                class="card-img-top"
                alt="Atividade esportiva do resort"
              />
              <div class="card-body">
                <h2 class="card-title">Esportes</h2>
              </div>
            </article>
          </div>

          <div class="col-12 col-md-6">
            <article class="card h-100">
              <img
                src="img/lazer-externo/barco.jpg"
                class="card-img-top"
                alt="Passeio oferecido pelo resort"
              />
              <div class="card-body">
                <h2 class="card-title">Passeios</h2>
              </div>
            </article>
          </div>
        </div>
      </section>
    </main>

    <div id="footer"></div>

    <script src="js/menu.js"></script>
  </body>
</html>
